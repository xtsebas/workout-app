name: workout_app
description: "iOS app for tracking gym progress — routines, workout logging, and monthly progress visualization."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.8.1

  # Local database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.25
  sqlite3: ^2.9.4
  path_provider: ^2.1.5
  path: ^1.9.0

  # Network
  dio: ^5.8.0+1
  cached_network_image: ^3.4.1

  # Auth & cloud sync foundation
  supabase_flutter: ^2.8.0
  flutter_dotenv: ^5.2.1

  # Google Sign-In
  google_sign_in: ^6.2.2

  # PDF import
  pdfrx: ^1.0.97
  file_picker: ^10.1.4

  # Charts
  fl_chart: ^0.70.2

  # Animations
  flutter_animate: ^4.5.2

  # Fonts
  google_fonts: ^6.2.1

  # Utils
  intl: ^0.20.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Used directly in widget tests to mock Supabase's local session storage
  shared_preferences: ^2.5.5

  # Code generation
  build_runner: ^2.4.13
  drift_dev: ^2.22.1
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  assets:
    - .env
